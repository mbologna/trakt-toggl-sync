name: CI

"on":
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  security-events: write

env:
  REGISTRY_IMAGE_GHCR: ghcr.io/${{ github.repository_owner }}/trakt-toggl-sync

jobs:
  python:
    uses: mbologna/.github/.github/workflows/python-ci.yml@66fa463456a77b2b1fd085534e191823b9e25c0a # main
    with:
      python_version: "3.14"
      use_uv: true
      enable_codecov: true
    secrets: inherit

  docker:
    uses: mbologna/.github/.github/workflows/docker-ci.yml@66fa463456a77b2b1fd085534e191823b9e25c0a # main
    with:
      image_name: trakt-toggl-sync
      push_to_dockerhub: true
      enable_cosign: true
      enable_grype: true
      enable_release_drafter: true
    secrets: inherit

  verify:
    name: Verify Reproducible Build
    runs-on: ubuntu-latest
    needs: docker
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository_owner == github.actor
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Rebuild for reproducibility check (AMD64)
        id: rebuild
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: repro-test:latest
          cache-from: type=gha
          provenance: false
          sbom: false

      - name: Verify reproducible build
        run: |
          echo "Pulling reference image..."
          docker pull --platform linux/amd64 \
            "${{ env.REGISTRY_IMAGE_GHCR }}@${{ needs.docker.outputs.digest }}"
          REMOTE=$(docker inspect \
            "${{ env.REGISTRY_IMAGE_GHCR }}@${{ needs.docker.outputs.digest }}" \
            --format="{{.RootFS}}")
          LOCAL=$(docker inspect repro-test:latest --format="{{.RootFS}}")
          echo "Remote RootFS: $REMOTE"
          echo "Local RootFS:  $LOCAL"
          if [ "$REMOTE" = "$LOCAL" ]; then
            echo "Build is reproducible"
          else
            echo "Build differs (expected due to timestamps)"
          fi

  deploy:
    needs: [docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: mbologna/.github/.github/workflows/gcp-deploy.yml@66fa463456a77b2b1fd085534e191823b9e25c0a # main
    with:
      image_name: trakt-toggl-sync
      ar_image: us-central1-docker.pkg.dev/trakt-toggl-sync/syncer/app
      deploy_type: job
      deploy_name: trakt-toggl-sync
      region: us-central1
    secrets: inherit

  status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [python, docker, verify]
    if: always()
    steps:
      - name: Check status
        run: |
          if [[ "${{ needs.python.result }}" == "failure" ]] || \
             [[ "${{ needs.docker.result }}" == "failure" ]]; then
            exit 1
          fi
